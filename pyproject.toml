[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "computer-use-lab"
version = "0.1.0"
description = "Replaceable desktop drivers, capability probes, and a model-driven agent"
requires-python = ">=3.12"
dependencies = ["mcp>=1.20,<2", "jsonschema>=4.23,<5"]

[project.scripts]
computer-use = "computer_use.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use"]
